# SonarCloud reads this file in CI (.github/workflows/ci.yml, "SonarCloud scan").
# It checks bugs, security hotspots, duplicated code and test coverage of new code.
sonar.organization=mohamedfaizel
sonar.projectKey=mohamedfaizel_job-search-dashboard
sonar.projectName=Job search

sonar.sources=apps/web/src,apps/api/src,packages/data/src
sonar.tests=apps/web/src,apps/api/src,apps/api/test,packages/data/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.e2e-spec.ts,**/test/**
sonar.exclusions=apps/api/src/generated/**,**/*.stories.tsx,**/*.d.ts
# Test helpers (fake API servers, fixtures) are not app code. Next's layouts, pages and request
# config only wire things together on the server; the build and browser checks cover them.
sonar.coverage.exclusions=**/test/**,**/*.test.*,**/*.spec.ts,**/main.ts,apps/api/prisma/**,apps/web/src/app/**/layout.tsx,apps/web/src/app/**/page.tsx,apps/web/src/i18n/request.ts

sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/api/coverage/lcov.info,apps/api/coverage-e2e/lcov.info,packages/data/coverage/lcov.info
sonar.sourceEncoding=UTF-8
