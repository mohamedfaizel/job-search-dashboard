<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Job Search Hunter</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f1f5f9;
        color: #0f172a;
        font:
          16px/1.5 system-ui,
          sans-serif;
        padding: 16px;
        box-sizing: border-box;
      }
      main {
        max-width: 24rem;
        text-align: center;
        background: #fff;
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: 0 1px 3px #0002;
        border-top: 6px solid #0b0b0b;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 12px 0 4px;
      }
      p {
        margin: 4px 0;
        color: #475569;
      }
      button {
        margin-top: 16px;
        background: #ffcc00;
        color: #141000;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        font:
          600 1rem system-ui,
          sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Connect to the internet to see your jobs.</p>
      <p lang="de">Du bist offline. Verbinde dich mit dem Internet, um deine Jobs zu sehen.</p>
      <button type="button" onclick="location.reload()">Try again · Erneut versuchen</button>
    </main>
  </body>
</html>
