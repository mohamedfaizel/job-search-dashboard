  markNotificationsRead: Int!

  """
  Score your resume against a job with Resume-Matcher. Returns at once as PENDING; poll jobMatch until READY or FAILED (a minute or two). Uses AI credits
  """
  matchJob(jobId: ID!): JobMatch!

  """
  Scores the resume saved for this job with Resume-Matcher (AI match). Returns at once with aiStatus PENDING; poll jobInsights until READY or FAILED (a minute or two). Uses AI credits
  """
  matchJobResume(jobId: ID!): JobInsights!

  """Moves a job one place up or down in your Apply queue"""
  moveInApplyQueue(direction: QueueDirection!, jobId: ID!): [ApplyQueueItem!]!

  """
  Works out Fit % for every job again, now. Normally it happens by itself. Returns how many jobs got a score
  """
  recalculateFit: Int!

  """Takes jobs out of your Apply queue"""
  removeFromApplyQueue(jobIds: [ID!]!): [ApplyQueueItem!]!

  """
  Removes a skill or keyword ("I don’t have it" or "not relevant") from this job, or from every job
  """
  removeInsightTerm(everywhere: Boolean! = false, jobId: ID!, term: String!): JobInsights!

  """
  Takes the skills the fact check flagged out of the Skills section of the resume you wrote for this job, then scores it again
  """
  removeUnsupportedSkills(jobId: ID!): JobInsights!

  """Throws a job’s changes away: the copy becomes your master resume again"""
  resetJobResumeBuild(jobId: String!): JobResumeBuild!

  """
  Reads the resume into sections again: from My profile, or from an AI chat reply
  """
  restartResumeBuild(language: String!, reply: String): ResumeBuild!

  """Puts a removed skill or keyword back"""
  restoreInsightTerm(jobId: ID!, term: String!): JobInsights!

  """Import from JobHunter with a saved search"""
  runSavedSearch(
    id: Int!

    """Continue its last import instead"""
    resume: Boolean! = false
  ): SyncJobsResult!

  """
  Keeps an answer for the next jobs. The same question again replaces its answer
  """
  saveAnswer(answer: String!, question: String!): SavedAnswer!

  """Saves or replaces one of your keys."""
  saveApiKey(input: SaveApiKeyInput!): ApiKey!

  """Saves Claude's reply to the queue prompt, each part to its own job"""
  saveApplyQueueReply(text: String!): [ApplyQueueItem!]!

  """
  Keeps your decisions on Claude’s questions for this job (JSON text). Needs a saved reply
  """
  saveClaudeAnswers(answers: String!, jobId: ID!): JobInsights!

  """Saves your cover letter template in one language"""
  saveCoverLetterTemplate(language: String!, text: String!): CoverLetterTemplate!

  """
  Saves Claude's answer to the interview prep prompt for this job (replacing the one before)
  """
  saveInterviewPrep(jobId: ID!, text: String!): JobInsights!

  """Saves the cover letter for a job (needs a resume copy for it first)"""
  saveJobCoverLetter(jobId: String!, text: String!): JobCoverLetter!

  """Saves a job’s resume (JSON text)"""
  saveJobResumeBuild(doc: String!, jobId: String!): JobResumeBuild!

  """
  Saves pasted text as the resume you wrote for this job (replacing the one before), and scores it
  """
  saveJobResumeText(jobId: ID!, text: String!): JobInsights!

  """
  Saves your master resume in another language (e.g. "de"), replacing the one before
  """
  saveLanguageResume(language: String!, text: String!): Profile!

  """
  Saves Claude’s reply to the design prompt as My design and makes it your default template
  """
  saveMyDesign(reply: String!): DocumentStyle!

  """
  Saves the builder resume (JSON text) and writes it to My profile as text
  """
  saveResumeBuild(doc: String!, language: String!): ResumeBuild!

  """Adds a story (no id) or changes one (with its id)"""
  saveStory(input: StoryInput!): Story!

  """
  Saves your Job posts filters and sort (JSON text), replacing the ones before
  """
  saveTableSettings(settings: String!): Boolean!

  """
  Picks your AI: Claude or OpenAI, for the AI score and the copy-and-open buttons.
  """
  setAiProvider(provider: AiProvider!): User!

  """
  Changes the AI model used with a saved key. Empty means the default model.
  """
  setApiKeyModel(kind: ApiKeyKind!, model: String): ApiKey!

  """
  "I have this": adds a missing skill to the Skills list of My profile, or a keyword (keyword: true) to its Keywords list (have: true), or takes it off (have: false). It then counts as covered for every job
  """
  setHaveTerm(have: Boolean! = true, jobId: ID!, keyword: Boolean! = false, term: String!): JobInsights!

  """
  Sets when your interview for this job is (null clears it). Moves the job to Interviewing
  """
  setInterviewDate(at: DateTime, jobId: ID!): JobInsights!

  """
  Edits the languages line of this job’s Apply kit prompt. Empty = your profile’s Languages again
  """
  setJobLanguages(jobId: ID!, languages: String): JobInsights!

  """
  Show the app in this language: "en" or "de"
  """
  setLocale(locale: String!): User!

  """Turn scheduled runs of a saved search on or off"""
  setSavedSearchSchedule(id: Int!, input: ScheduleInput!): SavedSearch!

  """Create an account and log in"""
  signUp(input: SignUpInput!): User!

  """Starts a resume copy for a job from your master resume"""
  startJobResumeBuild(jobId: String!): JobResumeBuild!

  """
  Call when you open Job posts. Returns the time after which jobs are New for this visit (null on your first visit)
  """
  startJobsVisit: DateTime

  """Reads the last two weeks of mail in every connected account, now."""
  syncGmail: GmailSyncResult!

  """Fetch jobs from JobHunter and save them"""
  syncJobs(input: SyncJobsInput!): SyncJobsResult!

  """
  Send your uploaded resume file to Resume-Matcher, replacing the previous copy. Its AI reads it, which can take a minute
  """
  syncResumeToMatcher: MatcherResume!

  """
  Have Resume-Matcher rewrite your resume for a job and write a cover letter. Returns at once as PENDING; poll tailoredResume until READY or FAILED. Uses AI credits
  """
  tailorResume(jobId: ID!): TailoredResume!

  """
  Tries a saved key: JobHunter with a one-job search (at most 1 credit), Claude and OpenAI by listing their models (free).
  """
  testApiKey(kind: ApiKeyKind!): ApiKeyTest!

  """Show a hidden job in your table again"""
  unhideJob(id: ID!): Boolean!
  updateDocumentStyle(input: DocumentStyleInput!): DocumentStyle!

  """
  Track your progress: Saved, Applied, Interviewing… Only you see your status.
  """
  updateJobStatus(id: ID!, status: ApplicationStatus!): Job!

  """Settings > Notifications"""
  updateNotificationSettings(input: NotificationSettingsInput!): Profile!
  updateProfile(input: ProfileInput!): Profile!
  updateSavedSearch(id: Int!, input: SavedSearchInput!): SavedSearch!
}

