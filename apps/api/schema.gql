  """The improved section as JSON text, ready to put into the resume"""
  section: String!
  sectionId: String!
}

input SignUpInput {
  email: String!
  locale: String
  name: String!
  password: String!
}

enum SortDirection {
  ASC
  DESC
}

"""One story of your story bank (STAR): situation, task, action, result"""
type Story {
  """Action: what you did, step by step"""
  action: String!
  id: Int!

  """Reflection: what you learned or would do differently"""
  reflection: String!

  """Result: what came of it, with real numbers"""
  result: String!

  """Situation: where you were and what was going on"""
  situation: String!

  """
  Skills or themes it shows, e.g. "leadership"
  """
  tags: [String!]!

  """Task: what you had to do"""
  task: String!

  """
  A short name, e.g. "Cut the nightly load from 4 h to 40 min"
  """
  title: String!
  updatedAt: DateTime!
}

"""A new story (no id) or a change to one (with its id)"""
input StoryInput {
  action: String! = ""
  id: Int
  reflection: String! = ""
  result: String! = ""
  situation: String! = ""
  tags: [String!]! = []
  task: String! = ""
  title: String!
}

input SyncJobsInput {
  """
  COMPANY_BOARDS only: the career pages to read, e.g. ["greenhouse:stripe", "lever:netflix", "ashby:ramp"] or their addresses
  """
  boards: [String!]

  """ISO country codes, e.g. ["DE"]"""
  countryCodes: [String!]

  """
  Any of full-time, part-time, contract, internship. Postings with no type are kept.
  """
  employmentTypes: [String!]

  """Skip postings whose title contains any of these, e.g. ["Werkstudent"]"""
  excludeTitles: [String!]

  """
  Languages the posting is written in, ISO 639-1 codes, e.g. ["en", "de"]. Unlabelled postings are kept.
  """
  languages: [String!]

  """
  Cities or regions, e.g. ["Berlin", "Bavaria"]. Combine with countryCodes.
  """
  locations: [String!]

  """Only postings from the last N days"""
  maxAgeDays: Int! = 7

  """Stop after this many pages to protect credits"""
  maxPages: Int! = 1

  """Only postings whose posted salary reaches this many euros a year"""
  minSalaryEur: Int

  """
  Only ask for postings JobHunter found since the last complete run of this search
  """
  onlyNew: Boolean! = true

  """
  Jobs per page (each job costs a credit). JobHunter caps it by plan: Free 25, Builder/Growth 100, Scale/Business 500.
  """
  pageSize: Int! = 25

  """Only postings flagged remote"""
  remoteOnly: Boolean! = false

  """Continue the last import of this search from the page where it stopped"""
  resume: Boolean! = false

  """Match any of these skills, e.g. ["react"]"""
  skills: [String!]

  """
  Skip postings that ask for fluent German (fließende Deutschkenntnisse and the like)
  """
  skipFluentGerman: Boolean! = false

  """
  Where to look. ARBEITSAGENTUR and COMPANY_BOARDS are free and use titles, locations, job type, remote, age and excludeTitles; COMPANY_BOARDS also needs boards.
  """
  source: ImportSource! = JOBHUNTER

  """Match any of these job titles, e.g. ["frontend"]"""
  titles: [String!]!
}

type SyncJobsResult {
  created: Int!

  """Credits this run used"""
  creditsCharged: Int!
  creditsRemaining: Int
  fetched: Int!

  """True when more pages were left unfetched"""
  hasMore: Boolean!

  """Jobs that were free because they were already paid this month"""
  jobsAlreadyPaid: Int!

  """
  With onlyNew: postings found since this time were asked for. Null on a first run.
  """
  newSince: DateTime
  pages: Int!

  """True when this run continued an earlier import from its saved cursor"""
  resumed: Boolean!

  """Total matches JobHunter reported"""
  totalAvailable: Int
  updated: Int!

  """Things worth knowing, e.g. a company board that could not be read"""
  warnings: [String!]!
}

type SyncRunModel {
  """False when pages were left unfetched"""
  complete: Boolean!
  created: Int!
  creditsCharged: Int
  fetched: Int!
  finishedAt: DateTime!
  id: Int!
  jobsAlreadyPaid: Int
  savedSearchId: Int

  """Name of the saved search that ran it"""
  savedSearchName: String

  """True when the scheduler started it"""
  scheduled: Boolean!

  """When the import started (for a continued import: the run it continued)"""
  startedAt: DateTime!

  """
  Short description of what was searched, e.g. "frontend · DE · Berlin"
  """
  summary: String!
  updated: Int!
}

"""
Your resume rewritten by Resume-Matcher for one job, with a cover letter. Download both as PDFs from /tailored/{jobId}/resume.pdf and /tailored/{jobId}/cover-letter.pdf
"""
type TailoredResume {
  """The cover letter text. Null if it could not be written"""
  coverLetter: String

  """What went wrong. Null unless FAILED"""
  error: String
  finishedAt: DateTime
  jobId: ID!

  """You sent a newer resume since, so tailor again to use it"""
  outdated: Boolean!

  """The resume file it was tailored from"""
  resumeFileName: String

  """ATS score of the tailored version (0-100)"""
  score: Float
  startedAt: DateTime!
  status: JobMatchStatus!
}

type TermCheck {
  """Your resume text mentions it"""
  inResume: Boolean!

  """
  For a missing term: the skill in your resume or profile that makes it a fair addition, e.g. "graphql" for "apollo"
  """
  relatedTo: String

  """
  A skill tag or keyword, e.g. "kafka"
  """
  term: String!

  """
  Not in your resume text, but on the Skills list of My profile ("I have this"). It counts as covered, and the prompt tells Claude it must be in the resume
  """
  youHave: Boolean!
}

type User {
  """
  Your AI for the AI score and the copy-and-open buttons (Settings > API keys)
  """
  aiProvider: AiProvider!
  email: String!
  id: Int!

  """
  The language the app is shown in: "en" or "de"
  """
  locale: String!
  name: String!

  """False until you finish or skip the first-login steps"""
  onboarded: Boolean!
  role: Role!
}

enum VisaSponsorship {
  NO
  NOT_STATED
  OFFERS
}

"""
A master resume you uploaded as Word (.docx), and whether it works as a template
"""
type WordTemplate {
  fileName: String!

  """The language of that resume (ISO 639-1)"""
  language: String!

  """The section headings found, in order"""
  sections: [String!]!

  """Its section headings were found, so it can be filled in"""
  usable: Boolean!

  """What won’t carry over, in plain words"""
  warnings: [String!]!
}

enum Workplace {
  HYBRID
  ONSITE
  REMOTE
}