type Query {
  """One Claude prompt for the queued jobs that have no reply yet (up to 5)"""
  applyQueuePrompt: ApplyQueuePrompt!

  """How your resume and cover letter PDFs look"""
  documentStyle: DocumentStyle!
  documentTemplates: DocumentTemplates!

  """Your connected Gmail accounts."""
  gmailStatus: GmailStatus!

  """How many jobs you have hidden"""
  hiddenJobCount: Int!

  """Today's credits used against DAILY_CREDIT_CAP"""
  importBudget: ImportBudget!
  job(id: ID!): Job!

  """Values to offer in each column filter"""
  jobFilterOptions: JobFilterOptions!

  """
  Title, language, skills and keywords of a job, checked against your resume. Free and instant: no AI
  """
  jobInsights(jobId: ID!): JobInsights!

  """Your resume match for one job. Null if you never matched it"""
  jobMatch(jobId: ID!): JobMatch

  """Jobs for the dashboard table: filter, sort and paginate"""
  jobsPage(filter: JobFilterInput, page: Int! = 1, pageSize: Int! = 25, sort: JobSortInput): JobPage!

  """Tracker changes suggested by employer emails, waiting for your answer."""
  mailSuggestions: [MailSuggestion!]!

  """Who is logged in, or null"""
  me: User

  """Your tracker: jobs you saved, applied to, etc."""
  myApplications: [Application!]!

  """Jobs you lined up to apply for, oldest first"""
  myApplyQueue: [ApplyQueueItem!]!

  """
  Your master resume's copy in Resume-Matcher, which jobs are matched against
  """
  myMatcherResume: MatcherResume!
  myProfile: Profile!

  """
  Your saved Job posts filters and sort, as JSON text. Null if you never saved any
  """
  myTableSettings: String

  """Your bell list, newest first"""
  notifications: Notifications!
  resumeMatcherStatus(
    """
    Also send a test message to the AI provider (costs a fraction of a cent)
    """
    checkAi: Boolean! = false
  ): ResumeMatcherStatus!

  """
  Makes the resume PDF saved for a job and checks it the way an ATS reads it: pages, text, e-mail, dates, characters and skills
  """
  resumePdfCheck(jobId: ID!, template: String): PdfCheck!

  """Your saved searches, by name, with their last import"""
  savedSearches: [SavedSearch!]!

  """Past imports, newest first"""
  syncRuns(limit: Int! = 20, savedSearchId: Int): [SyncRunModel!]!

  """Your tailored resume for one job. Null if you never tailored it"""
  tailoredResume(jobId: ID!): TailoredResume

  """
  A prompt for Claude that translates your master resume into a language, keeping every fact
  """
  translationPrompt(language: String!): String!
}

"""
UP moves a job one place earlier in the Apply queue, DOWN one place later
"""
enum QueueDirection {
  DOWN
  UP
}

type RemovedTerm {
  """True when it is removed from every job, not just this one"""
  everywhere: Boolean!
  term: String!
}

type ResumeMatcherStatus {
  """An AI provider key is set. Null unless checkAi was true"""
  aiConfigured: Boolean

  """A test message to the AI provider worked. Null unless checkAi was true"""
  aiHealthy: Boolean

  """The AI model Resume-Matcher really uses"""
  aiModel: String

  """
  The AI provider Resume-Matcher really uses, e.g. anthropic. One saved in its own Settings page beats .env. Null when it isn't reachable
  """
  aiProvider: String

  """False when RESUME_MATCHER_URL is not set in .env"""
  configured: Boolean!

  """One sentence for the user saying what works and what to fix"""
  message: String!

  """The Resume-Matcher container answered its health check"""
  reachable: Boolean!
}

"""A suggestion for your master resume"""
type ResumeSuggestion {
  """
  LEVEL, DATES, CLICHES, SYMBOLS, NUMBERS, LENGTH, CONTACT, WORK_PERMIT or ACHIEVEMENTS
  """
  code: String!

  """
  What was found. NUMBERS: "with/bullets"; LENGTH: "words/pages/limit"; ACHIEVEMENTS: the lines
  """
  detail: String!
}

enum Role {
  ADMIN
  USER
}

type SavedSearch {
  """Company career pages, for the COMPANY_BOARDS source"""
  boards: [String!]!
  countryCodes: [String!]!
  createdAt: DateTime!
  employmentTypes: [String!]!
  excludeTitles: [String!]!
  id: Int!
  languages: [String!]!

  """The most recent import of this search"""
  lastRun: SyncRunModel
  locations: [String!]!
  maxAgeDays: Int!
  maxPages: Int!

  """Euros a year"""
  minSalaryEur: Int
  name: String!

  """When the scheduler runs it next"""
  nextRunAt: DateTime
  onlyNew: Boolean!
  pageSize: Int!
  remoteOnly: Boolean!

  """Time of day for scheduled runs, "HH:mm" in the server's local time"""
  runAt: String!
  schedule: ScheduleFrequency!

  """
  What happened at the last scheduled time (ran, skipped for credits, failed)
  """
  scheduleNote: String
  skills: [String!]!
  skipFluentGerman: Boolean!

  """Where this search looks for jobs"""
  source: ImportSource!
  titles: [String!]!
}

input SavedSearchInput {
  """
  COMPANY_BOARDS only: the career pages to read, e.g. ["greenhouse:stripe", "lever:netflix", "ashby:ramp"] or their addresses
  """
  boards: [String!]

  """ISO country codes, e.g. ["DE"]"""
  countryCodes: [String!]

  """
  Any of full-time, part-time, contract, internship. Postings with no type are kept.
  """
  employmentTypes: [String!]

  """Skip postings whose title contains any of these, e.g. ["Werkstudent"]"""
  excludeTitles: [String!]

  """
  Languages the posting is written in, ISO 639-1 codes, e.g. ["en", "de"]. Unlabelled postings are kept.
  """
  languages: [String!]

  """
  Cities or regions, e.g. ["Berlin", "Bavaria"]. Combine with countryCodes.
  """
  locations: [String!]

  """Only postings from the last N days"""
  maxAgeDays: Int! = 7

  """Stop after this many pages to protect credits"""
  maxPages: Int! = 1

  """Only postings whose posted salary reaches this many euros a year"""
  minSalaryEur: Int

  """
  A name you will recognise, e.g. "Frontend in Berlin"
  """
  name: String!

  """
  Only ask for postings JobsPipe found since the last complete run of this search
  """
  onlyNew: Boolean! = true

  """
  Jobs per page (each job costs a credit). JobsPipe caps it by plan: Free 25, Builder/Growth 100, Scale/Business 500.
  """
  pageSize: Int! = 25

  """Only postings flagged remote"""
  remoteOnly: Boolean! = false

  """Match any of these skills, e.g. ["react"]"""
  skills: [String!]

  """
  Skip postings that ask for fluent German (fließende Deutschkenntnisse and the like)
  """
  skipFluentGerman: Boolean! = false

  """
  Where to look. ARBEITSAGENTUR and COMPANY_BOARDS are free and use titles, locations, job type, remote, age and excludeTitles; COMPANY_BOARDS also needs boards.
  """
  source: ImportSource! = JOBSPIPE

  """Match any of these job titles, e.g. ["frontend"]"""
  titles: [String!]!
}

"""How often a saved search runs by itself"""
enum ScheduleFrequency {
  DAILY
  HOURLY
  OFF
  WEEKDAYS
}

input ScheduleInput {
  """"HH:mm", 24-hour, server local time"""
  runAt: String! = "07:00"
  schedule: ScheduleFrequency!
}

input SignUpInput {
