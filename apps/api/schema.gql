  """When the import started (for a continued import: the run it continued)"""
  startedAt: DateTime!

  """
  Short description of what was searched, e.g. "frontend · DE · Berlin"
  """
  summary: String!
  updated: Int!
}

"""
Your resume rewritten by Resume-Matcher for one job, with a cover letter. Download both as PDFs from /tailored/{jobId}/resume.pdf and /tailored/{jobId}/cover-letter.pdf
"""
type TailoredResume {
  """The cover letter text. Null if it could not be written"""
  coverLetter: String

  """What went wrong. Null unless FAILED"""
  error: String
  finishedAt: DateTime
  jobId: ID!

  """You sent a newer resume since, so tailor again to use it"""
  outdated: Boolean!

  """The resume file it was tailored from"""
  resumeFileName: String

  """ATS score of the tailored version (0-100)"""
  score: Float
  startedAt: DateTime!
  status: JobMatchStatus!
}

type TermCheck {
  """Your resume text mentions it"""
  inResume: Boolean!

  """
  For a missing term: the skill in your resume or profile that makes it a fair addition, e.g. "graphql" for "apollo"
  """
  relatedTo: String

  """
  A skill tag or keyword, e.g. "kafka"
  """
  term: String!

  """
  Not in your resume text, but on the Skills list of My profile ("I have this"). It counts as covered, and the prompt tells Claude it must be in the resume
  """
  youHave: Boolean!
}

type User {
  email: String!
  id: Int!
  name: String!
  role: Role!
}

enum VisaSponsorship {
  NO
  NOT_STATED
  OFFERS
}

enum Workplace {
  HYBRID
  ONSITE
  REMOTE
}