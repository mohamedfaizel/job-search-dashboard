services:
  postgres:
    image: postgres:16-alpine
    container_name: jobsearch-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobsearch}
      POSTGRES_DB: ${POSTGRES_DB:-jobsearch}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jobsearch}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: Resume-Matcher (github.com/srbhr/Resume-Matcher) tailors a resume to one job.
  # Only starts with `pnpm rm:up` (the "tools" profile), never with `pnpm db:up`.
  resume-matcher:
    image: ghcr.io/srbhr/resume-matcher:1.4.0
    container_name: jobsearch-resume-matcher
    profiles: ['tools']
    ports:
      # Our API already uses 3000, so Resume-Matcher is on http://localhost:3100.
      # 127.0.0.1 keeps it on this PC only: Resume-Matcher has no logins, so it must never be
      # reachable from your network. Our API is the only thing that calls it.
      - '127.0.0.1:3100:3000'
    volumes:
      - resume-data:/app/backend/data
    environment:
      # Docker Compose fills ${...} from the repo-root .env. The defaults after :- are used
      # when a variable is missing. Change the model with RM_LLM_MODEL, no code change needed.
      LLM_PROVIDER: ${RM_LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${RM_LLM_MODEL:-claude-sonnet-5-5}
      LLM_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Only for Ollama: http://host.docker.internal:11434
      LLM_API_BASE: ${RM_LLM_API_BASE:-}
    extra_hosts:
      # Lets it reach Ollama on your PC at http://host.docker.internal:11434.
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  # Optional: turns resumes and cover letters into PDFs in the template you pick (LaTeX).
  # Only starts with `pnpm pdf:up`. Without it, downloads fall back to a plain PDF.
  pdf-renderer:
    build: ./docker/pdf-renderer
    image: jobsearch-pdf-renderer
    container_name: jobsearch-pdf-renderer
    profiles: ['tools']
    ports:
      # 127.0.0.1: only programs on this PC (our API) can reach it.
      - '127.0.0.1:8090:8090'
    restart: unless-stopped

volumes:
  pgdata:
  resume-data:
