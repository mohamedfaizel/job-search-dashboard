services:
  postgres:
    image: postgres:16-alpine
    container_name: jobsearch-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobsearch}
      POSTGRES_DB: ${POSTGRES_DB:-jobsearch}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jobsearch}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: Resume-Matcher (github.com/srbhr/Resume-Matcher) tailors a resume to one job.
  # Only starts with `pnpm rm:up` (the "tools" profile), never with `pnpm db:up`.
  resume-matcher:
    image: ghcr.io/srbhr/resume-matcher:1.4.0
    container_name: jobsearch-resume-matcher
    profiles: ['tools']
    ports:
      # Our API already uses 3000, so Resume-Matcher is on http://localhost:3100.
      - '3100:3000'
    volumes:
      - resume-data:/app/backend/data
    extra_hosts:
      # Lets it reach Ollama on your PC at http://host.docker.internal:11434.
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  pgdata:
  resume-data:
