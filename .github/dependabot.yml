# Dependabot opens a pull request when a dependency has a newer version or a security fix.
# Grouped so you get a few PRs a week, not dozens. CI runs on each one before you merge.
# Big version jumps (a new major version, e.g. graphql 16 -> 17) are skipped: they often need
# code changes, so we do them on purpose in our own PR. Dependabot alerts still show them.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace: reads the root pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories: [/docker/pdf-renderer]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
