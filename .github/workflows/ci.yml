name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow's GitHub token may only read the code, so a bad dependency can't push or
# change the repo.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: a key that was committed and later deleted is still readable.
          fetch-depth: 0
      # Gitleaks (free, open source) looks for passwords, API keys and tokens in every commit.
      # If it finds one: remove it from the code, then change that key where it came from.
      - name: Look for passwords and API keys in the code
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --no-banner --redact --verbose .

  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobsearch
          POSTGRES_PASSWORD: jobsearch
          POSTGRES_DB: jobsearch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobsearch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      TEST_DATABASE_URL: postgresql://jobsearch:jobsearch@localhost:5432/jobsearch_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarCloud uses the git history to tell new code from old

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint
        env:
          # Typed lint of the whole repo needs more than Node's default 2 GB heap.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests (with coverage)
        run: pnpm test:coverage

      - name: API end-to-end tests (GraphQL + PostgreSQL, with coverage)
        run: pnpm test:e2e:coverage

      - name: Build
        run: pnpm build

      # Skipped until the SONAR_TOKEN secret is added to the repo (see README, "Code quality").
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
